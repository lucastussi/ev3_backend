{% extends "base.html" %}
{% block title %}{{ form.instance.pk|yesno:"Editar Asset,Nuevo Asset" }}{% endblock %}
{% block content %}
  <div class="card">
    <div class="card-body">
      <h5 class="card-title">{{ form.instance.pk|yesno:"Editar Asset,Nuevo Asset" }}</h5>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'assets:list' %}" class="btn btn-secondary">Cancelar</a>
      </form>
    </div>
  </div>
{% endblock %}
