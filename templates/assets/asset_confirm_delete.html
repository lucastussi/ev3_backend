{% extends "base.html" %}
{% block title %}Eliminar Asset{% endblock %}
{% block content %}
  <div class="alert alert-warning">
    <h5>¿Seguro que deseas eliminar "{{ object.name }}"?</h5>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Sí, eliminar</button>
      <a href="{% url 'assets:list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
  </div>
{% endblock %}
