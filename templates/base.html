<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>EV3 - Backend</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap opcional (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand" href="/assets/">EV3</a>
        <div class="d-flex">
          {% if user.is_authenticated %}
            <span class="navbar-text me-3">Hola, {{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}" style="display:inline;">
              {% csrf_token %}
              <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
            </form>
          {% else %}
            <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Iniciar sesión</a>
          {% endif %}
        </div>
      </div>
    </nav>
    <main class="container">
      {% if messages %}
        {% for m in messages %}
          <div class="alert alert-{{ m.tags }}">{{ m }}</div>
        {% endfor %}
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
